<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕊️ Pelada da Paz</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <style>
        /* ===== RESET E BASE ===== */
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #1a2a3a; display: flex; justify-content: center; padding: 20px; }
        .container { background: #fff; max-width: 1100px; width: 100%; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #1a2a3a; border-bottom: 3px solid #f39c12; padding-bottom: 10px; margin-top: 0; font-size: 2rem; }
        h1 .pomba { font-size: 2.2rem; margin-right: 8px; }

        /* ===== NAVEGAÇÃO ENTRE ÁREAS ===== */
        .nav-botoes { display: flex; gap: 8px; margin-bottom: 15px; }
        .nav-botoes button {
            flex: 1; padding: 8px 12px; border: none; border-radius: 8px;
            font-weight: bold; cursor: pointer; font-size: 0.95rem; color: #fff;
            transition: background 0.2s;
        }
        .btn-plantel { background: #8e44ad; }
        .btn-plantel:hover { background: #6c3483; }
        .btn-sorteio { background: #2980b9; }
        .btn-sorteio:hover { background: #1a5276; }

        /* ===== PAINEL DE GERENCIAMENTO ===== */
        .painel-gerenciamento {
            background: #f0f3f7; border-radius: 16px; padding: 20px;
            margin: 20px 0; border: 2px solid #8e44ad; display: none;
        }
        .painel-gerenciamento.ativo { display: block; }

        .area-cadastro { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; align-items: center; }
        .area-cadastro input, .area-cadastro select {
            flex: 1; padding: 10px; border: 2px solid #ccc; border-radius: 8px; min-width: 120px;
        }
        .area-cadastro button {
            background: #2ecc71; border: none; padding: 10px 20px;
            border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer;
        }
        .area-cadastro button:hover { background: #27ae60; }

        .busca input {
            width: 100%; padding: 10px; border: 2px solid #ccc;
            border-radius: 8px; margin-bottom: 15px; font-size: 1rem;
        }

        .lista-plantel { background: #fff; padding: 10px; border-radius: 8px; max-height: 300px; overflow-y: auto; }
        .plantel-item {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 8px; border-bottom: 1px solid #e0e0e0; flex-wrap: wrap;
        }
        .nome-area { display: flex; align-items: center; gap: 6px; flex: 2; min-width: 120px; }
        .nome-area .nome { font-weight: 500; padding: 2px 6px; border-radius: 4px; min-width: 60px; }
        .nome-area input[type="text"] {
            padding: 2px 6px; border: 2px solid #8e44ad; border-radius: 4px;
            font-weight: 500; font-size: 1rem; width: 150px;
        }
        .controles { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .controles select { padding: 2px 6px; border-radius: 6px; border: 1px solid #ccc; }
        .controles input[type="number"] {
            width: 50px; padding: 2px 6px; border-radius: 6px;
            border: 1px solid #ccc; font-size: 1rem;
        }
        .controles button {
            background: transparent; border: none; cursor: pointer;
            font-weight: bold; padding: 2px 8px; border-radius: 6px;
            font-size: 0.9rem; transition: 0.2s;
        }

        /* Botões de ação (cores por classe) */
        .btn-editar-nome   { background: #8e44ad; color: #fff; }
        .btn-editar-nome:hover { background: #6c3483; }
        .btn-editar-nota   { background: #f39c12; color: #fff; }
        .btn-editar-nota:hover { background: #d68910; }
        .btn-editar-capa   { background: #2980b9; color: #fff; }
        .btn-editar-capa:hover { background: #1a5276; }
        .btn-editar-pontos { background: #27ae60; color: #fff; }
        .btn-editar-pontos:hover { background: #1e8449; }
        .btn-excluir       { background: #e74c3c; color: #fff; }
        .btn-excluir:hover { background: #b03a2e; }
        .btn-cancelar      { background: #95a5a6; color: #fff; }
        .btn-cancelar:hover { background: #7f8c8d; }
        .btn-salvar        { background: #2ecc71; color: #fff; }
        .btn-salvar:hover  { background: #27ae60; }

        .sem-jogadores { color: #888; font-style: italic; padding: 10px; text-align: center; }

        .ranking-capas { margin-top: 20px; padding-top: 15px; border-top: 2px solid #8e44ad; }
        .ranking-capas h3 { color: #8e44ad; margin-top: 0; }
        .ranking-pontos { margin-top: 20px; padding-top: 15px; border-top: 2px solid #27ae60; }
        .ranking-pontos h3 { color: #27ae60; margin-top: 0; }

        /* ===== AÇÕES DO PLANTEL ===== */
        .acoes-plantel { display: flex; gap: 10px; flex-wrap: wrap; margin: 15px 0; align-items: center; }
        .acoes-plantel button {
            border: none; padding: 8px 18px; border-radius: 8px;
            color: #fff; font-weight: bold; cursor: pointer;
        }
        .btn-pdf           { background: #e74c3c; }
        .btn-pdf:hover     { background: #b03a2e; }
        .btn-zerar-capas   { background: #8e44ad; }
        .btn-zerar-capas:hover { background: #6c3483; }
        .btn-zerar-pontos  { background: #2980b9; }
        .btn-zerar-pontos:hover { background: #1a5276; }
        .btn-exportar-txt  { background: #16a085; }
        .btn-exportar-txt:hover { background: #117a65; }
        .btn-importar-txt  { background: #d35400; }
        .btn-importar-txt:hover { background: #a04000; }

        /* ===== ÁREA DA PARTIDA ===== */
        .area-partida { display: block; }
        .area-partida.oculto { display: none; }

        .busca-partida { margin-bottom: 10px; }
        .busca-partida input {
            width: 100%; padding: 10px; border: 2px solid #ccc;
            border-radius: 8px; font-size: 1rem;
        }

        .lista-jogadores {
            background: #f4f6f9; padding: 10px; border-radius: 8px;
            margin: 15px 0; max-height: 200px; overflow-y: auto;
        }
        .jogador-item {
            display: flex; align-items: center; gap: 12px;
            padding: 4px 8px; border-bottom: 1px solid #ddd;
        }
        .jogador-item label { flex: 1; cursor: pointer; }
        .jogador-item .nota { font-weight: bold; margin-left: 10px; color: #2980b9; }

        .acoes-partida { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
        .acoes-partida button {
            background: #95a5a6; border: none; padding: 6px 16px;
            border-radius: 6px; color: #fff; cursor: pointer; font-size: 0.9rem;
        }
        .acoes-partida button:hover { background: #7f8c8d; }

        .info { font-size: 0.95rem; color: #2c3e50; margin: 5px 0 10px 0; }

        .config { display: flex; align-items: center; gap: 20px; margin: 15px 0; flex-wrap: wrap; }
        .config label { font-weight: bold; }
        .config input { padding: 8px 15px; border-radius: 8px; border: 2px solid #ccc; width: 80px; }

        .btn-sortear {
            background: #e67e22; border: none; padding: 15px 30px;
            border-radius: 12px; color: #fff; font-size: 1.2rem;
            font-weight: bold; cursor: pointer; width: 100%;
        }
        .btn-sortear:hover { background: #d35400; }

        /* ===== CARDS DE TIME ===== */
        .times-grid {
            margin-top: 25px; display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;
        }
        .time-card {
            border-radius: 12px; padding: 15px; border-left: 6px solid #f39c12;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: background 0.3s, color 0.3s;
            background: #f8f9fa; color: #212529;
        }
        .time-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
        .nome-time { display: flex; align-items: center; gap: 8px; flex: 1; }
        .nome-time h3 {
            margin: 0; cursor: pointer; padding: 4px 8px; border-radius: 6px;
            transition: background 0.2s; flex: 1; color: inherit;
        }
        .nome-time h3:hover { background: rgba(0,0,0,0.1); }
        .pontos-header {
            font-size: 1.6rem; font-weight: bold; background: rgba(0,0,0,0.05);
            padding: 0 14px; border-radius: 8px; min-width: 60px;
            text-align: center; white-space: nowrap; color: inherit;
        }
        .time-card ul { list-style: none; padding: 0; margin: 0 0 10px 0; }
        .time-card ul li {
            padding: 4px 0; border-bottom: 1px dashed rgba(0,0,0,0.1);
            display: flex; justify-content: space-between; color: inherit;
        }
        .time-card ul li .nota { font-weight: bold; color: inherit; }
        .soma-media { display: flex; justify-content: space-between; font-size: 0.9rem; margin: 6px 0; color: inherit; }

        .placar-time {
            display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start;
            gap: 16px; margin-top: 8px; padding-top: 8px;
            border-top: 2px solid rgba(0,0,0,0.15); color: inherit;
        }
        .placar-time .grupo { display: flex; align-items: center; gap: 6px; }
        .placar-time .grupo span {
            font-weight: bold; min-width: 35px; text-align: left;
            font-size: 1rem; color: inherit;
        }
        .placar-time button {
            background: #ecf0f1; border: none; border-radius: 6px;
            padding: 4px 10px; font-size: 1rem; cursor: pointer;
            font-weight: bold; transition: 0.2s; color: #000;
            min-width: 30px; line-height: 1.2;
        }
        .placar-time button:hover { background: #d5dbdb; }
        .btn-vitoria { background: #27ae60; color: #fff; }
        .btn-vitoria:hover { background: #1e8449; }
        .btn-empate { background: #f39c12; color: #fff; }
        .btn-empate:hover { background: #d68910; }
        .btn-diminuir { background: #e74c3c; color: #fff; padding: 4px 8px; }
        .btn-diminuir:hover { background: #b03a2e; }

        .desequilibrio { text-align: center; margin: 15px 0 5px 0; font-weight: bold; color: #2c3e50; }

        /* ===== RODAPÉ DE AÇÕES ===== */
        .footer-acoes { display: flex; justify-content: space-between; flex-wrap: wrap; margin-top: 15px; gap: 10px; }
        .footer-acoes button {
            background: #7f8c8d; border: none; padding: 8px 20px;
            border-radius: 8px; color: #fff; cursor: pointer; font-weight: bold;
        }
        .footer-acoes button:hover { background: #5d6d7e; }
        .btn-copiar { background: #16a085 !important; }
        .btn-copiar:hover { background: #117a65 !important; }
        .btn-finalizar { background: #8e44ad !important; }
        .btn-finalizar:hover { background: #6c3483 !important; }

        #importInput { display: none; }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 700px) {
            .time-header { flex-wrap: wrap; }
            .placar-time { flex-direction: column; align-items: stretch; }
            .placar-time .grupo { justify-content: flex-start; }
            .plantel-item { flex-direction: column; align-items: stretch; }
            .nome-area { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><span class="pomba">🕊️</span> Pelada da Paz</h1>

        <div class="nav-botoes">
            <button class="btn-plantel" onclick="abrirGerenciamento()">📋 Plantel</button>
            <button class="btn-sorteio" onclick="fecharGerenciamento()">🎲 Sorteio</button>
        </div>

        <div class="painel-gerenciamento" id="painelGerenciamento">
            <h2 style="margin-top:0; color:#8e44ad;">📋 Gerenciar Plantel</h2>

            <div class="area-cadastro">
                <input type="text" id="novoNome" placeholder="Nome do jogador">
                <select id="novaNota">
                    <option value="0">0</option><option value="0.5">0.5</option>
                    <option value="1">1</option><option value="1.5">1.5</option>
                    <option value="2">2</option><option value="2.5">2.5</option>
                    <option value="3">3</option><option value="3.5">3.5</option>
                    <option value="4">4</option><option value="4.5">4.5</option>
                    <option value="5" selected>5</option>
                    <option value="5.5">5.5</option><option value="6">6</option>
                    <option value="6.5">6.5</option><option value="7">7</option>
                    <option value="7.5">7.5</option><option value="8">8</option>
                    <option value="8.5">8.5</option><option value="9">9</option>
                    <option value="9.5">9.5</option><option value="10">10</option>
                </select>
                <button onclick="adicionarJogadorPlantel()">➕ Adicionar</button>
            </div>

            <div class="busca">
                <input type="text" id="buscaPlantel" placeholder="🔍 Buscar jogador no plantel..." oninput="renderizarPlantel()">
            </div>

            <div class="lista-plantel" id="listaPlantel">
                <div class="sem-jogadores">Nenhum jogador cadastrado.</div>
            </div>

            <div class="ranking-capas" id="rankingCapas">
                <h3>🏆 Ranking de Capas</h3>
                <div id="listaRankingCapas" class="lista-plantel">
                    <div class="sem-jogadores">Nenhum jogador cadastrado.</div>
                </div>
            </div>

            <div class="ranking-pontos" id="rankingPontos">
                <h3>⭐ Ranking de Pontos</h3>
                <div id="listaRankingPontos" class="lista-plantel">
                    <div class="sem-jogadores">Nenhum jogador cadastrado.</div>
                </div>
            </div>

            <div class="acoes-plantel">
                <button class="btn-pdf" onclick="exportarPDF()">📄 Exportar PDF (Geral)</button>
                <button class="btn-exportar-txt" onclick="exportarDados()">📤 Exportar TXT</button>
                <button class="btn-importar-txt" onclick="document.getElementById('importInput').click()">📥 Importar TXT</button>
                <button class="btn-zerar-capas" onclick="zerarCapas()">🧹 Zerar Capas</button>
                <button class="btn-zerar-pontos" onclick="zerarPontos()">🧹 Zerar Pontos</button>
            </div>
        </div>
        <div class="area-partida" id="areaPartida">
            <div class="busca-partida">
                <input type="text" id="buscaPartida" placeholder="🔍 Buscar jogador para selecionar..." oninput="renderizarSorteio()">
            </div>

            <div class="lista-jogadores" id="listaSorteio">
                <em style="color: #888;">Nenhum jogador cadastrado.</em>
            </div>
            <div class="info" id="infoSelecionados">Nenhum jogador selecionado.</div>

            <div class="acoes-partida">
                <button onclick="selecionarTodos(true)">✅ Selecionar todos</button>
                <button onclick="selecionarTodos(false)">❌ Desmarcar todos</button>
            </div>

            <div class="config">
                <label for="tamanhoDesejado">Quantos jogadores por time (N)?</label>
                <input type="number" id="tamanhoDesejado" value="4" min="3" step="1">
            </div>

            <button class="btn-sortear" onclick="sortearTimes()">🎲 Sortear Times</button>

            <div id="resultado" style="margin-top: 20px;"></div>

            <div class="footer-acoes">
                <button onclick="zerarTudo()">🗑️ Zerar tudo</button>
                <button class="btn-copiar" onclick="copiarSorteio()">📋 Copiar Sorteio</button>
                <button class="btn-finalizar" onclick="finalizarPelada()">🏁 Finalizar Pelada</button>
            </div>
        </div>

        <input type="file" id="importInput" accept=".txt" onchange="importarDados(event)">
    </div>
    <script>
        // ============================================================
        //  CONSTANTES GLOBAIS
        // ============================================================
        const CORES_PT = {
            'vermelho': 'red', 'azul': 'blue', 'verde': 'green', 'amarelo': 'yellow',
            'roxo': 'purple', 'laranja': 'orange', 'rosa': 'pink', 'marrom': 'brown',
            'preto': 'black', 'branco': 'white', 'cinza': 'gray', 'ciano': 'cyan',
            'magenta': 'magenta', 'limão': 'lime', 'oliva': 'olive', 'vinho': 'maroon',
            'marinho': 'navy', 'turquesa': 'turquoise', 'violeta': 'violet', 'ouro': 'gold',
            'prata': 'silver', 'coral': 'coral', 'salmão': 'salmon', 'pêssego': 'peachpuff',
            'lavanda': 'lavender', 'menta': 'mintcream'
        };

        const NOTAS_VALIDAS = [0, 0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5, 5.5, 6, 6.5, 7, 7.5, 8, 8.5, 9, 9.5, 10];

        // ============================================================
        //  DADOS GLOBAIS
        // ============================================================
        let jogadores = [];
        let timesAtuais = [];
        let modoGerenciamento = false;

        // ============================================================
        //  HELPERS DE COR
        // ============================================================
        function traduzirCor(nome) {
            return CORES_PT[nome.trim().toLowerCase()] || nome.trim().toLowerCase();
        }

        function corParaRGB(nomeCor) {
            const temp = document.createElement('div');
            temp.style.color = traduzirCor(nomeCor);
            document.body.appendChild(temp);
            const computed = getComputedStyle(temp).color;
            document.body.removeChild(temp);
            const match = computed.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
            return match
                ? { r: +match[1], g: +match[2], b: +match[3] }
                : { r: 248, g: 249, b: 250 };
        }

        function textoContrastePara({ r, g, b }) {
            const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            return lum > 0.5 ? { r: 0, g: 0, b: 0 } : { r: 255, g: 255, b: 255 };
        }

        function isValidColor(nomeCor) {
            const temp = document.createElement('div');
            temp.style.color = traduzirCor(nomeCor);
            return temp.style.color !== '';
        }

        function getContrastColor(nomeCor) {
            const rgb = corParaRGB(nomeCor);
            const c = textoContrastePara(rgb);
            return (c.r === 0 && c.g === 0 && c.b === 0) ? '#000000' : '#ffffff';
        }

        // ============================================================
        //  COMPARADORES DE RANKING
        // ============================================================
        function compararPorPontos(a, b) {
            const pa = a.pontosJogador || 0, pb = b.pontosJogador || 0;
            if (pb !== pa) return pb - pa;
            const ca = a.pontosCapa || 0, cb = b.pontosCapa || 0;
            if (cb !== ca) return cb - ca;
            return a.nome.localeCompare(b.nome);
        }

        function compararPorCapas(a, b) {
            const ca = a.pontosCapa || 0, cb = b.pontosCapa || 0;
            if (cb !== ca) return cb - ca;
            return a.nome.localeCompare(b.nome);
        }

        function compararPorNotas(a, b) {
            if (b.nota !== a.nota) return b.nota - a.nota;
            return (b.pontosCapa || 0) - (a.pontosCapa || 0);
        }

        // ============================================================
        //  HELPERS DE CÁLCULO DE TIMES
        // ============================================================
        function calcularSomasEMedias(times) {
            const somas = times.map(t => t.reduce((acc, j) => acc + (j.nota || 0), 0));
            const medias = somas.map((s, i) => times[i].length ? s / times[i].length : 0);
            return { somas, medias };
        }

        function renderizarTimesAtuais() {
            const times = timesAtuais.map(t => t.jogadores);
            const { somas, medias } = calcularSomasEMedias(times);
            exibirTimes(times, somas, medias, times.map(t => t.length));
        }

        // ============================================================
        //  ORDENAÇÃO VISUAL DE TIMES
        // ============================================================
        function obterOrdemTimesPorPontos() {
            const todosZerados = timesAtuais.every(t => (t.pontos || 0) === 0);

            if (todosZerados) {
                return timesAtuais.map((_, i) => i);
            }

            const medias = timesAtuais.map(t => {
                const soma = t.jogadores.reduce((s, j) => s + (j.nota || 0), 0);
                return t.jogadores.length ? soma / t.jogadores.length : 0;
            });

            return timesAtuais
                .map((_, i) => i)
                .sort((a, b) => {
                    const pa = timesAtuais[a].pontos || 0;
                    const pb = timesAtuais[b].pontos || 0;
                    if (pb !== pa) return pb - pa;
                    return medias[b] - medias[a];
                });
        }

        // ============================================================
        //  PERSISTÊNCIA — JOGADORES
        // ============================================================
        function salvarJogadores() {
            localStorage.setItem('plantel', JSON.stringify(jogadores));
        }

        function carregarJogadores() {
            const dados = localStorage.getItem('plantel');
            jogadores = dados ? (() => { try { return JSON.parse(dados); } catch { return []; } })() : [];
            jogadores.forEach(j => {
                if (j.selecionado === undefined) j.selecionado = true;
                j.editandoNome = j.editandoNota = j.editandoCapa = j.editandoPontos = false;
                if (j.pontosCapa === undefined) j.pontosCapa = 0;
                if (j.pontosJogador === undefined) j.pontosJogador = 0;
            });
            atualizarTodasListas();
        }

        // ============================================================
        //  PERSISTÊNCIA — TIMES
        // ============================================================
        function salvarTimes() {
            try {
                localStorage.setItem('timesAtuais', JSON.stringify(timesAtuais));
            } catch (e) {
                console.warn('Não foi possível salvar os times:', e);
            }
        }

        function carregarTimes() {
            const dados = localStorage.getItem('timesAtuais');
            if (!dados) return;
            try {
                const salvos = JSON.parse(dados);
                if (!Array.isArray(salvos) || !salvos.length) return;

                timesAtuais = salvos.map(t => ({
                    nome: t.nome || 'Time',
                    vitorias: t.vitorias || 0,
                    empates: t.empates || 0,
                    pontos: t.pontos || 0,
                    jogadores: (t.jogadores || []).map(j => {
                        const encontrado = jogadores.find(p => p.nome === j.nome);
                        return encontrado ? { ...encontrado } : j;
                    }).filter(j => j && j.nome)
                })).filter(t => t.jogadores.length > 0);

                if (!timesAtuais.length) return;
                renderizarTimesAtuais();
                console.log('Times restaurados:', timesAtuais.length);
            } catch (e) {
                console.warn('Erro ao restaurar times:', e);
                localStorage.removeItem('timesAtuais');
            }
        }

        // ============================================================

        // ============================================================
        //  EXPORTAR / IMPORTAR TXT
        // ============================================================
        function exportarDados() {
            if (!jogadores.length) { alert('Não há dados para exportar.'); return; }
            const linhas = jogadores.map(j =>
                `${j.nome};${j.nota};${j.pontosCapa || 0};${j.pontosJogador || 0};${j.selecionado}`
            );
            const blob = new Blob([linhas.join('\n')], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'plantel.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importarDados(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const linhas = e.target.result.split('\n').filter(l => l.trim() !== '');
                    const novos = [];
                    for (const line of linhas) {
                        const p = line.split(';').map(s => s.trim());
                        if (p.length < 2) continue;
                        const nota = parseFloat(p[1]);
                        if (isNaN(nota) || nota < 0 || nota > 10) continue;
                        novos.push({
                            nome: p[0],
                            nota,
                            pontosCapa: p.length >= 3 ? (parseFloat(p[2]) || 0) : 0,
                            pontosJogador: p.length >= 4 ? (parseFloat(p[3]) || 0) : 0,
                            selecionado: p.length >= 5 ? p[4].toLowerCase() === 'true' : true,
                            editandoNome: false,
                            editandoNota: false,
                            editandoCapa: false,
                            editandoPontos: false
                        });
                    }
                    if (!novos.length) {
                        alert('Nenhum jogador válido encontrado no arquivo.');
                        return;
                    }
                    if (jogadores.length > 0 && !confirm(
                        `O plantel atual (${jogadores.length} jogadores) será substituído pelo importado (${novos.length} jogadores). Continuar?`
                    )) return;

                    jogadores = novos.sort((a, b) => a.nome.localeCompare(b.nome));
                    salvarJogadores();
                    atualizarTodasListas();
                    if (modoGerenciamento) {
                        renderizarPlantel();
                        renderizarRankingCapas();
                        renderizarRankingPontos();
                    }
                    alert(`Dados importados com sucesso! ${jogadores.length} jogadores carregados.`);
                } catch (err) {
                    alert('Erro ao ler o arquivo: ' + err.message);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ============================================================
        //  CONFIG DE LARGURAS DOS RANKINGS NO PDF
        // ============================================================
        function calcularLargurasRankingsPDF(pageWidth) {
            const margemEsq = 20, margemDir = 20;
            const larguraUtil = pageWidth - margemEsq - margemDir;

            const totalPesos = 18.4;
            const u = larguraUtil / totalPesos;

            const larguras = {
                0:  { cellWidth: 0.8 * u, halign: 'center' },
                1:  { cellWidth: 2.8 * u },
                2:  { cellWidth: 1.6 * u, halign: 'center' },
                3:  { cellWidth: 0.4 * u, halign: 'center' },
                4:  { cellWidth: 0.8 * u, halign: 'center' },
                5:  { cellWidth: 2.8 * u },
                6:  { cellWidth: 1.6 * u, halign: 'center' },
                7:  { cellWidth: 0.4 * u, halign: 'center' },
                8:  { cellWidth: 0.8 * u, halign: 'center' },
                9:  { cellWidth: 2.8 * u },
                10: { cellWidth: 1.6 * u, halign: 'center' },
                11: { cellWidth: 1.6 * u, halign: 'center' },
                12: { cellWidth: 0.4 * u, halign: 'center' }
            };

            const w = i => larguras[i].cellWidth;
            const xTituloPontos = margemEsq;
            const xTituloCapas  = margemEsq + w(0) + w(1) + w(2) + w(3);
            const xTituloNotas  = xTituloCapas + w(4) + w(5) + w(6) + w(7);

            return { larguras, margemEsq, margemDir, xTituloPontos, xTituloCapas, xTituloNotas };
        }

        function estiloCelulasRankingsPDF(data) {
            if (data.section === 'head') {
                const i = data.column.index;
                if (i >= 0 && i <= 2) {
                    data.cell.styles.fillColor = '#27ae60';
                    data.cell.styles.textColor = '#fff';
                } else if (i === 3) {
                    data.cell.styles.fillColor = '#ffffff';
                    data.cell.styles.textColor = '#cccccc';
                } else if (i >= 4 && i <= 6) {
                    data.cell.styles.fillColor = '#2980b9';
                    data.cell.styles.textColor = '#fff';
                } else if (i === 7) {
                    data.cell.styles.fillColor = '#ffffff';
                    data.cell.styles.textColor = '#cccccc';
                } else if (i >= 8 && i <= 11) {
                    data.cell.styles.fillColor = '#8e44ad';
                    data.cell.styles.textColor = '#fff';
                } else if (i === 12) {
                    data.cell.styles.fillColor = '#ffffff';
                    data.cell.styles.textColor = '#cccccc';
                }
            }
            if (data.section === 'body' && [3, 7, 12].includes(data.column.index)) {
                data.cell.styles.fillColor = '#ffffff';
            }
        }

        function montarBodyRankingsPDF(listaJogadores) {
            const rankingPontos = [...listaJogadores].sort(compararPorPontos);
            const dadosPontos = rankingPontos.map((j, i) => ({
                posicao: i + 1, nome: j.nome, pontos: j.pontosJogador || 0
            }));

            const rankingCapas = [...listaJogadores].sort(compararPorCapas);
            const dadosCapas = rankingCapas.map((j, i) => ({
                posicao: i + 1, nome: j.nome, capas: j.pontosCapa || 0
            }));

            const rankingNotas = [...listaJogadores].sort(compararPorNotas);
            const dadosNotas = rankingNotas.map((j, i) => ({
                posicao: i + 1, nome: j.nome, nota: j.nota, capas: j.pontosCapa || 0
            }));

            const maxLinhas = Math.max(dadosPontos.length, dadosCapas.length, dadosNotas.length);
            const body = [];
            for (let i = 0; i < maxLinhas; i++) {
                const p = dadosPontos[i] || { posicao: '', nome: '', pontos: '' };
                const c = dadosCapas[i]  || { posicao: '', nome: '', capas: '' };
                const n = dadosNotas[i]  || { posicao: '', nome: '', nota: '', capas: '' };
                body.push([
                    p.posicao ? p.posicao + 'º' : '',
                    p.nome,
                    p.pontos !== '' ? p.pontos : '',
                    '',
                    c.posicao ? c.posicao + 'º' : '',
                    c.nome,
                    c.capas !== '' ? c.capas : '',
                    '',
                    n.posicao ? n.posicao + 'º' : '',
                    n.nome,
                    n.nota !== '' ? n.nota : '',
                    n.capas !== '' ? n.capas : '',
                    ''
                ]);
            }
            return body;
        }

        function desenharTabelasRankingsPDF(doc, listaJogadores, startY) {
            const pageWidth = doc.internal.pageSize.width;
            const { larguras, margemEsq, margemDir, xTituloPontos, xTituloCapas, xTituloNotas } =
                calcularLargurasRankingsPDF(pageWidth);

            const body = montarBodyRankingsPDF(listaJogadores);

            doc.setFontSize(11);
            doc.setFont('helvetica', 'bold');
            doc.setTextColor(26, 42, 58);
            doc.text('Pontos Corridos', xTituloPontos, startY);
            doc.text('Ranking de Capas', xTituloCapas, startY);
            doc.text('Ranking de Notas', xTituloNotas, startY);

            doc.autoTable({
                startY: startY + 8,
                head: [[
                    '', 'Nome', 'Pontos', '',
                    '', 'Nome', 'Capas', '',
                    '', 'Nome', 'Nota', 'Capas', ''
                ]],
                body: body,
                theme: 'striped',
                headStyles: { fontSize: 9, halign: 'center', fillColor: '#8e44ad', textColor: '#fff' },
                bodyStyles: { fontSize: 8.5 },
                columnStyles: larguras,
                margin: { left: margemEsq, right: margemDir },
                didParseCell: estiloCelulasRankingsPDF,
                rowPageBreak: 'avoid'
            });
        }

        // ============================================================
        //  DESENHO DOS CARDS DE TIME NO PDF (resumo da rodada)
        // ============================================================
        function desenharResumoRodadaPDF(doc, timesDados, startY) {
            const pageWidth = doc.internal.pageSize.width;
            const pageHeight = doc.internal.pageSize.height;
            const margem = 20, gap = 10;
            const nTimes = timesDados.length;

            const colunas = Math.min(nTimes, 5);

            const larguraDisponivel = pageWidth - margem * 2;
            const cardW = (larguraDisponivel - gap * (colunas - 1)) / colunas;
            const cardPad = 6;
            const alturaPorJogador = 12;
            const alturaHeader = 24;
            const alturaMinima = 90;

            let y = startY;
            let idx = 0;

            while (idx < nTimes) {
                const restantes = nTimes - idx;
                const naLinha = Math.min(colunas, restantes);

                let alturaLinha = 0;
                for (let c = 0; c < naLinha; c++) {
                    const t = timesDados[idx + c];
                    const h = alturaHeader + 16 + (t.jogadores.length * alturaPorJogador) + cardPad * 2;
                    if (h > alturaLinha) alturaLinha = h;
                }
                if (alturaLinha < alturaMinima) alturaLinha = alturaMinima;

                if (y + alturaLinha > pageHeight - margem - 20) {
                    doc.addPage();
                    y = margem;
                }

                const larguraTotalLinha = naLinha * cardW + (naLinha - 1) * gap;
                const xInicio = margem + (larguraDisponivel - larguraTotalLinha) / 2;

                for (let c = 0; c < naLinha; c++) {
                    const t = timesDados[idx + c];
                    const xCard = xInicio + c * (cardW + gap);

                    const corFundo = corParaRGB(t.nome);
                    const corTexto = textoContrastePara(corFundo);

                    doc.setFillColor(corFundo.r, corFundo.g, corFundo.b);
                    if (doc.roundedRect) {
                        doc.roundedRect(xCard, y, cardW, alturaLinha, 4, 4, 'F');
                    } else {
                        doc.rect(xCard, y, cardW, alturaLinha, 'F');
                    }

                    doc.setTextColor(corTexto.r, corTexto.g, corTexto.b);

                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(10);
                    doc.text(t.nome, xCard + cardPad, y + cardPad + 9);

                    doc.setFontSize(12);
                    doc.text(String(t.pontos), xCard + cardW - cardPad, y + cardPad + 9, { align: 'right' });

                    doc.setFont('helvetica', 'normal');
                    doc.setFontSize(8);
                    let yJog = y + cardPad + alturaHeader;
                    t.jogadores.forEach(j => {
                        doc.text(j.nome, xCard + cardPad, yJog);
                        doc.setFont('helvetica', 'bold');
                        doc.text(String(j.nota), xCard + cardW - cardPad, yJog, { align: 'right' });
                        doc.setFont('helvetica', 'normal');
                        yJog += alturaPorJogador;
                    });

                    doc.setDrawColor(corTexto.r, corTexto.g, corTexto.b);
                    doc.setLineWidth(0.3);
                    doc.line(xCard + cardPad, yJog - 2, xCard + cardW - cardPad, yJog - 2);

                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(8);
                    yJog += 2;
                    doc.text(`Soma: ${t.soma.toFixed(1)}`, xCard + cardPad, yJog + 7);
                    doc.text(`Média: ${t.media.toFixed(2)}`, xCard + cardW - cardPad, yJog + 7, { align: 'right' });
                    yJog += 11;

                    doc.setFont('helvetica', 'normal');
                    doc.text(`Vit: ${t.vitorias}   Emp: ${t.empates}`, xCard + cardPad, yJog + 5);
                }

                idx += naLinha;
                y += alturaLinha + gap;
            }

            doc.setTextColor(0, 0, 0);
            return y;
        }

        // ============================================================
        //  PDF DE FINALIZAÇÃO (Resumo + Rankings + linha divisória)
        // ============================================================
        function gerarPDFFinalizacao(snapshotTimes, snapshotJogadores) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('portrait', 'pt', 'a4');

            const dataAtual = new Date().toLocaleDateString('pt-BR', {
                day: '2-digit', month: '2-digit', year: 'numeric'
            });

            doc.setFontSize(20);
            doc.setFont('helvetica', 'bold');
            doc.setTextColor(26, 42, 58);
            doc.text('Resumo da Rodada - Pelada da Paz', 20, 35);
            doc.text(`Data: ${dataAtual}`, doc.internal.pageSize.width - 20, 35, { align: 'right' });

            const timesDados = snapshotTimes.map(t => {
                const soma = t.jogadores.reduce((acc, j) => acc + (j.nota || 0), 0);
                return {
                    nome: t.nome || 'Time',
                    pontos: t.pontos || 0,
                    vitorias: t.vitorias || 0,
                    empates: t.empates || 0,
                    jogadores: t.jogadores.map(j => ({ nome: j.nome, nota: j.nota })),
                    soma,
                    media: t.jogadores.length ? soma / t.jogadores.length : 0
                };
            });

            timesDados.sort((a, b) => {
                if (b.pontos !== a.pontos) return b.pontos - a.pontos;
                return b.media - a.media;
            });

            const yDepoisTimes = desenharResumoRodadaPDF(doc, timesDados, 60);

            let startY = yDepoisTimes + 20;
            if (startY > doc.internal.pageSize.height - 120) {
                doc.addPage();
                startY = 40;
            }

            doc.setDrawColor(180, 180, 180);
            doc.setLineWidth(0.8);
            doc.line(20, startY, doc.internal.pageSize.width - 20, startY);

            startY += 26;

            doc.setTextColor(26, 42, 58);
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(16);
            doc.text('Rankings Atualizados', 20, startY);
            startY += 16;

            desenharTabelasRankingsPDF(doc, snapshotJogadores, startY);

            const pageCount = doc.internal.getNumberOfPages();
            for (let i = 1; i <= pageCount; i++) {
                doc.setPage(i);
                doc.setFontSize(8);
                doc.setTextColor(100, 100, 100);
                doc.text(`Pelada da Paz - Página ${i} de ${pageCount}`, 20, doc.internal.pageSize.height - 15);
            }

            doc.save('resultado_rodada_pelada_da_paz.pdf');
        }

        // ============================================================
        //  CRUD — JOGADORES
        // ============================================================
        function adicionarJogadorPlantel() {
            const nomeInput = document.getElementById('novoNome');
            const notaSelect = document.getElementById('novaNota');
            const nome = nomeInput.value.trim();
            const nota = parseFloat(notaSelect.value);

            if (nome === '') { alert('Digite o nome do jogador.'); return; }
            if (jogadores.some(j => j.nome.toLowerCase() === nome.toLowerCase())) {
                alert('Jogador já cadastrado.');
                return;
            }
            jogadores.push({
                nome, nota,
                pontosCapa: 0, pontosJogador: 0,
                selecionado: true,
                editandoNome: false, editandoNota: false,
                editandoCapa: false, editandoPontos: false
            });
            nomeInput.value = '';
            jogadores.sort((a, b) => a.nome.localeCompare(b.nome));
            salvarJogadores();
            atualizarTodasListas();
            if (modoGerenciamento) {
                renderizarPlantel();
                renderizarRankingCapas();
                renderizarRankingPontos();
            }
        }

        function removerJogadorPlantel(index) {
            if (!confirm('Remover este jogador do plantel?')) return;
            jogadores.splice(index, 1);
            salvarJogadores();
            atualizarTodasListas();
            if (modoGerenciamento) {
                renderizarPlantel();
                renderizarRankingCapas();
                renderizarRankingPontos();
            }
            if (timesAtuais.length > 0) {
                timesAtuais = timesAtuais.map(time => {
                    time.jogadores = time.jogadores.filter(j => jogadores.some(p => p.nome === j.nome));
                    return time;
                }).filter(time => time.jogadores.length > 0);
                if (!timesAtuais.length) document.getElementById('resultado').innerHTML = '';
                salvarTimes();
            }
        }

        // ----- Edição de nome -----
        function iniciarEdicaoNome(index) { jogadores[index].editandoNome = true; renderizarPlantel(); }
        function cancelarEdicaoNome(index) { jogadores[index].editandoNome = false; renderizarPlantel(); }

        function salvarEdicaoNome(index) {
            const input = document.getElementById(`editNomePlantel-${index}`);
            if (!input) return;
            const novoNome = input.value.trim();
            if (novoNome === '') { alert('O nome não pode ficar vazio.'); return; }
            if (jogadores.some((j, i) => i !== index && j.nome.toLowerCase() === novoNome.toLowerCase())) {
                alert('Já existe um jogador com este nome.');
                return;
            }
            jogadores[index].nome = novoNome;
            jogadores[index].editandoNome = false;
            jogadores.sort((a, b) => a.nome.localeCompare(b.nome));
            salvarJogadores();
            atualizarTodasListas();
            if (modoGerenciamento) {
                renderizarPlantel();
                renderizarRankingCapas();
                renderizarRankingPontos();
            }
            sincronizarTimesComPlantel();
        }

        // ----- Edição de nota -----
        function iniciarEdicaoNota(index) { jogadores[index].editandoNota = true; renderizarPlantel(); }
        function cancelarEdicaoNota(index) { jogadores[index].editandoNota = false; renderizarPlantel(); }

        function salvarEdicaoNota(index) {
            const select = document.getElementById(`editNotaPlantel-${index}`);
            if (!select) return;
            jogadores[index].nota = parseFloat(select.value);
            jogadores[index].editandoNota = false;
            salvarJogadores();
            atualizarTodasListas();
            if (modoGerenciamento) {
                renderizarPlantel();
                renderizarRankingCapas();
                renderizarRankingPontos();
            }
            sincronizarTimesComPlantel();
        }

        // ----- Edição de capa -----
        function iniciarEdicaoCapa(index) { jogadores[index].editandoCapa = true; renderizarRankingCapas(); }
        function cancelarEdicaoCapa(index) { jogadores[index].editandoCapa = false; renderizarRankingCapas(); }

        function salvarEdicaoCapa(index) {
            const input = document.getElementById(`editCapaPlantel-${index}`);
            if (!input) return;
            let valor = parseFloat(input.value);
            if (isNaN(valor) || valor < 0) {
                alert('Digite um valor numérico válido (0 ou maior).');
                return;
            }
            jogadores[index].pontosCapa = Math.round(valor * 10) / 10;
            jogadores[index].editandoCapa = false;
            salvarJogadores();
            renderizarRankingCapas();
            renderizarRankingPontos();
        }

        // ----- Edição de pontos -----
        function iniciarEdicaoPontos(index) { jogadores[index].editandoPontos = true; renderizarRankingPontos(); }
        function cancelarEdicaoPontos(index) { jogadores[index].editandoPontos = false; renderizarRankingPontos(); }

        function salvarEdicaoPontos(index) {
            const input = document.getElementById(`editPontosPlantel-${index}`);
            if (!input) return;
            const valor = parseFloat(input.value);
            if (isNaN(valor)) { alert('Digite um valor numérico válido.'); return; }
            jogadores[index].pontosJogador = valor;
            jogadores[index].editandoPontos = false;
            salvarJogadores();
            renderizarRankingPontos();
        }

        // ----- Sincronização de times após edição de nome/nota -----
        function sincronizarTimesComPlantel() {
            if (!timesAtuais.length) return;
            timesAtuais.forEach(time => {
                time.jogadores.forEach(j => {
                    const encontrado = jogadores.find(p => p.nome === j.nome);
                    if (encontrado) { j.nome = encontrado.nome; j.nota = encontrado.nota; }
                });
            });
            renderizarTimesAtuais();
            salvarTimes();
        }

        // ============================================================
        //  ZERAR CAPAS E PONTOS
        // ============================================================
        function zerarCapas() {
            if (!jogadores.length) { alert('Não há jogadores cadastrados.'); return; }
            if (!confirm('⚠️ Tem certeza de que deseja ZERAR TODAS as capas de TODOS os jogadores?\n\nEssa ação não pode ser desfeita.')) return;
            jogadores.forEach(j => { j.pontosCapa = 0; });
            salvarJogadores();
            if (modoGerenciamento) {
                renderizarRankingCapas();
                renderizarRankingPontos();
                renderizarPlantel();
            }
            alert('Todas as capas foram zeradas.');
        }

        function zerarPontos() {
            if (!jogadores.length) { alert('Não há jogadores cadastrados.'); return; }
            if (!confirm('⚠️ Tem certeza de que deseja ZERAR TODOS os pontos de TODOS os jogadores?\n\nEssa ação não pode ser desfeita.')) return;
            jogadores.forEach(j => { j.pontosJogador = 0; });
            salvarJogadores();
            if (modoGerenciamento) {
                renderizarRankingPontos();
                renderizarPlantel();
            }
            alert('Todos os pontos foram zerados.');
        }

        // ============================================================
        //  RENDERIZAÇÃO — PLANTEL
        // ============================================================
        function renderizarPlantel() {
            const container = document.getElementById('listaPlantel');
            const busca = document.getElementById('buscaPlantel').value.toLowerCase().trim();
            const filtrados = jogadores.filter(j => j.nome.toLowerCase().includes(busca));

            if (!filtrados.length) {
                container.innerHTML = '<div class="sem-jogadores">Nenhum jogador encontrado.</div>';
                return;
            }
            let html = '';
            filtrados.forEach(j => {
                const idx = jogadores.indexOf(j);
                html += `<div class="plantel-item" id="plantel-item-${idx}">`;
                html += `<div class="nome-area">`;
                if (j.editandoNome) {
                    html += `<input type="text" id="editNomePlantel-${idx}" value="${j.nome}" placeholder="Nome">`;
                    html += `<button class="btn-salvar" onclick="salvarEdicaoNome(${idx})">💾</button>`;
                    html += `<button class="btn-cancelar" onclick="cancelarEdicaoNome(${idx})">✖</button>`;
                } else {
                    html += `<span class="nome">${j.nome}</span>`;
                    html += `<button class="btn-editar-nome" onclick="iniciarEdicaoNome(${idx})">✏️</button>`;
                }
                html += `</div>`;

                html += `<div class="controles">`;
                if (j.editandoNota) {
                    let selectHTML = `<select id="editNotaPlantel-${idx}">`;
                    NOTAS_VALIDAS.forEach(v => {
                        selectHTML += `<option value="${v}" ${v === j.nota ? 'selected' : ''}>${v}</option>`;
                    });
                    selectHTML += `</select>`;
                    html += selectHTML;
                    html += `<button class="btn-salvar" onclick="salvarEdicaoNota(${idx})">💾</button>`;
                    html += `<button class="btn-cancelar" onclick="cancelarEdicaoNota(${idx})">✖</button>`;
                } else {
                    html += `<span style="font-weight:bold; color:#2980b9;">${j.nota}</span>`;
                    html += `<button class="btn-editar-nota" onclick="iniciarEdicaoNota(${idx})">✏️</button>`;
                }
                html += `<button class="btn-excluir" onclick="removerJogadorPlantel(${idx})">🗑️</button>`;
                html += `</div></div>`;

        // ============================================================
        //  RENDERIZAÇÃO — RANKING DE CAPAS

        function renderizarRankingCapas() {

                    html += `<button class="btn-salvar" onclick="salvarEdicaoCapa(${idx})">💾</button>`;

        // ============================================================
        //  RENDERIZAÇÃO — RANKING DE PONTOS
        // ============================================================
        function renderizarRankingPontos() {
            const container = document.getElementById('listaRankingPontos');
            if (!jogadores.length) {
                container.innerHTML = '<div class="sem-jogadores">Nenhum jogador cadastrado.</div>';
                return;
            }
            const ranking = [...jogadores].sort(compararPorPontos);
            let html = '';
            ranking.forEach(j => {
                const idx = jogadores.indexOf(j);

                } else {

                    html += `<button class="btn-editar-pontos" onclick="iniciarEdicaoPontos(${idx})">✏️</button>`;
                }

        // ============================================================
        //  RENDERIZAÇÃO — LISTA DE SORTEIO
        // ============================================================
        function renderizarSorteio() {
            const div = document.getElementById('listaSorteio');
            const info = document.getElementById('infoSelecionados');
            const busca = document.getElementById('buscaPartida').value.toLowerCase().trim();

            if (!jogadores.length) {
                div.innerHTML = '<em style="color: #888;">Nenhum jogador cadastrado.</em>';
                info.innerText = 'Nenhum jogador selecionado.';
                return;
            }
            const filtrados = jogadores.filter(j => j.nome.toLowerCase().includes(busca));
            let html = '';
            filtrados.forEach(j => {
                const idx = jogadores.indexOf(j);
                html += `
                    <div class="jogador-item">
                        <input type="checkbox" ${j.selecionado ? 'checked' : ''} onchange="toggleSelecionado(${idx})">
                        <label onclick="toggleSelecionado(${idx})">
                            ${j.nome} <span class="nota" style="color:#2980b9;">${j.nota}</span>
                        </label>
                    </div>
                `;
            });
            div.innerHTML = html;

            const selecionados = jogadores.filter(j => j.selecionado);
            info.innerText = selecionados.length
                ? `📌 ${selecionados.length} jogador(es) selecionado(s) para o sorteio.`
                : 'Nenhum jogador selecionado.';
        }

        function atualizarTodasListas() {
            renderizarSorteio();
            if (modoGerenciamento) {
                renderizarPlantel();
                renderizarRankingCapas();
                renderizarRankingPontos();
            }
        }

        function selecionarTodos(valor) {
            jogadores.forEach(j => j.selecionado = valor);
            salvarJogadores();
            renderizarSorteio();
        }

        function toggleSelecionado(index) {
            jogadores[index].selecionado = !jogadores[index].selecionado;
            salvarJogadores();
            renderizarSorteio();
        }

        // ============================================================
        //  SORTEIO (Monte Carlo Puro + Desempate por Capas)
        // ============================================================
        function calcularDistribuicao(total, N) {
            if (total < N - 1) return null;
            const maxA = Math.floor(total / N);
            for (let a = maxA; a >= 0; a--) {
                const resto = total - a * N;
                if (resto % (N - 1) === 0) {
                    return { a, b: resto / (N - 1) };
                }
            }
            return null;
        }

        function sortearTimes() {
            const N = parseInt(document.getElementById('tamanhoDesejado').value);
            if (isNaN(N) || N < 3) { alert('Informe um número inteiro maior ou igual a 3.'); return; }

            const selecionados = jogadores.filter(j => j.selecionado);
            const total = selecionados.length;
            if (total === 0) { alert('Marque pelo menos alguns jogadores para o sorteio.'); return; }

            const dist = calcularDistribuicao(total, N);
            if (!dist) {
                alert(`Não é possível formar times com ${N} e ${N - 1} jogadores para um total de ${total} atletas. Tente outro valor de N.`);
                return;
            }

            const { a, b } = dist;
            const tamanhos = [];
            for (let i = 0; i < a; i++) tamanhos.push(N);
            for (let i = 0; i < b; i++) tamanhos.push(N - 1);

            function calcularDiferencaNotas(times) {
                const medias = times.map(t => {
                    if (t.length === 0) return 0;
                    return t.reduce((acc, j) => acc + (j.nota || 0), 0) / t.length;
                });
                return Math.max(...medias) - Math.min(...medias);
            }

            function calcularDiferencaCapas(times) {
                const somasCapas = times.map(t =>
                    t.reduce((acc, j) => acc + (j.pontosCapa || 0), 0)
                );
                return Math.max(...somasCapas) - Math.min(...somasCapas);
            }

            let melhorTimes = null;
            let menorDiffNotas = Infinity;
            let menorDiffCapas = Infinity;

            // 10.000 sorteios aleatórios para achar a combinação perfeita
            const tentativas = 10000;

            for (let t = 0; t < tentativas; t++) {
                // Embaralha os jogadores
                const copia = [...selecionados].sort(() => Math.random() - 0.5);

                // Distribui nos times de acordo com os tamanhos definidos
                const times = tamanhos.map(() => []);
                let idxJogador = 0;
                for (let i = 0; i < times.length; i++) {
                    for (let j = 0; j < tamanhos[i]; j++) {
                        times[i].push(copia[idxJogador++]);
                    }
                }

                const diffNotas = calcularDiferencaNotas(times);
                const diffCapas = calcularDiferencaCapas(times);

                // Se a diferença de notas for menor, é melhor.
                // Se for igual (empatada), a diferença de capas decide.
                const empateNotas = Math.abs(diffNotas - menorDiffNotas) < 0.0001;
                const melhoraNotas = diffNotas < menorDiffNotas - 0.0001;
                const melhoraCapasNoEmpate = empateNotas && diffCapas < menorDiffCapas - 0.0001;

                if (melhoraNotas || melhoraCapasNoEmpate) {
                    menorDiffNotas = diffNotas;
                    menorDiffCapas = diffCapas;
                    melhorTimes = JSON.parse(JSON.stringify(times));
                }

                // Se encontrou o equilíbrio perfeito (diferença zero nas notas), para de procurar
                if (menorDiffNotas === 0) break;
            }

            const { somas, medias } = calcularSomasEMedias(melhorTimes);

            timesAtuais = melhorTimes.map((time, i) => ({
                jogadores: time,
                nome: `Time ${i + 1}`,
                vitorias: 0,
                empates: 0,
                pontos: 0
            }));

            salvarTimes();
            exibirTimes(melhorTimes, somas, medias, tamanhos);
        }

        // ============================================================
        //  EXIBIR TIMES NA TELA
        // ============================================================
        function exibirTimes(times, somas, medias, tamanhos) {
            const div = document.getElementById('resultado');
            let html = '';
            html += '<div class="times-grid">';

            const ordem = obterOrdemTimesPorPontos();

            ordem.forEach(idx => {
                const time = times[idx];
                const timeData = timesAtuais[idx];
                const nomeTime = timeData.nome || `Time ${idx + 1}`;
                const corTraduzida = traduzirCor(nomeTime);
                const corValida = isValidColor(corTraduzida) ? corTraduzida : '#f8f9fa';
                const corTexto = getContrastColor(corValida);

                html += `
                    <div class="time-card" id="time-${idx}" style="background-color: ${corValida}; color: ${corTexto};">
                        <div class="time-header">
                            <div class="nome-time">
                                <h3 onclick="editarNomeTime(${idx})" id="nome-time-${idx}">${nomeTime}</h3>
                            </div>
                            <div class="pontos-header">${timeData.pontos}</div>
                        </div>
                        <ul>
                            ${time.map(j => `<li>${j.nome} <span class="nota">${j.nota}</span></li>`).join('')}
                        </ul>
                        <div class="soma-media">
                            <span>Soma: ${somas[idx].toFixed(1)}</span>
                            <span>Média: ${medias[idx].toFixed(2)}</span>
                        </div>
                        <div class="placar-time">
                            <div class="grupo">
                                <span class="v">Vit: ${timeData.vitorias}</span>
                                <button class="btn-vitoria" onclick="alterarPlacar(${idx}, 'vitoria', 1)">+</button>
                                <button class="btn-diminuir" onclick="alterarPlacar(${idx}, 'vitoria', -1)">-</button>
                            </div>
                            <div class="grupo">
                                <span class="e">Emp: ${timeData.empates}</span>
                                <button class="btn-empate" onclick="alterarPlacar(${idx}, 'empate', 1)">+</button>
                                <button class="btn-diminuir" onclick="alterarPlacar(${idx}, 'empate', -1)">-</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            const diff = Math.max(...medias) - Math.min(...medias);
            html += `<div class="desequilibrio">Desequilíbrio (diferença entre as médias): ${diff.toFixed(2)}</div>`;
            div.innerHTML = html;
        }

        // ============================================================
        //  EDITAR NOME DO TIME (aceita cor em português)
        // ============================================================
        function editarNomeTime(idx) {
            const timeData = timesAtuais[idx];
            const nomeAtual = timeData.nome || `Time ${idx + 1}`;
            const novoNome = prompt('Digite o novo nome do time (pode ser uma cor em português):', nomeAtual);
            if (novoNome === null || novoNome.trim() === '') return;

            timeData.nome = novoNome.trim();
            renderizarTimesAtuais();
            salvarTimes();
        }

        // ============================================================
        //  ALTERAR PLACAR (vitória = +3pts / empate = +1pt)
        // ============================================================
        function alterarPlacar(idx, tipo, delta) {
            if (idx < 0 || idx >= timesAtuais.length) return;
            const time = timesAtuais[idx];

            if (tipo === 'vitoria') {
                const nova = time.vitorias + delta;
                if (nova < 0) { alert('Vitórias não podem ficar negativas.'); return; }
                time.vitorias = nova;
                time.pontos += delta * 3;
            } else if (tipo === 'empate') {
                const nova = time.empates + delta;
                if (nova < 0) { alert('Empates não podem ficar negativos.'); return; }
                time.empates = nova;
                time.pontos += delta * 1;
            }
            renderizarTimesAtuais();
            salvarTimes();
        }
        // ============================================================
        //  ZERAR TUDO
        // ============================================================
        function zerarTudo() {
            if (!timesAtuais.length) return;
            if (!confirm('Zerar todos os placares e remover os times?')) return;
            timesAtuais = [];
            localStorage.removeItem('timesAtuais');
            document.getElementById('resultado').innerHTML = '';
        }

        // ============================================================
        //  COPIAR RESULTADO DO SORTEIO PARA A ÁREA DE TRANSFERÊNCIA
        //  Exibe apenas "Time X (Y pts)" — sem "1º lugar —"
        // ============================================================
        function copiarSorteio() {
            if (!timesAtuais.length) {
                alert('Nenhum time sorteado. Faça o sorteio primeiro.');
                return;
            }

            const ordem = obterOrdemTimesPorPontos();
            const linhas = ['🕊️ *Pelada da Paz* — Resultado do Sorteio', ''];

            ordem.forEach((idx) => {
                const t = timesAtuais[idx];
                const nome = t.nome || `Time ${idx + 1}`;
                const soma = t.jogadores.reduce((s, j) => s + (j.nota || 0), 0);
                const media = t.jogadores.length ? soma / t.jogadores.length : 0;

                linhas.push(`*${nome}* (${t.pontos} pts)`);
                linhas.push(`Soma: ${soma.toFixed(1)} | Média: ${media.toFixed(2)}`);
                t.jogadores.forEach(j => {
                    linhas.push(`  • ${j.nome} — ${j.nota}`);
                });
                linhas.push('');
            });

            linhas.push('_Gerado por Pelada da Paz_ 🕊️⚽');

            const texto = linhas.join('\n');

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(texto)
                    .then(() => alert('✅ Sorteio copiado para a área de transferência!'))
                    .catch(() => copiarTextoFallback(texto));
            } else {
                copiarTextoFallback(texto);
            }
        }

        // Fallback para navegadores antigos / contextos não seguros
        function copiarTextoFallback(texto) {
            const ta = document.createElement('textarea');
            ta.value = texto;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                alert('✅ Sorteio copiado para a área de transferência!');
            } catch (err) {
                alert('❌ Não foi possível copiar automaticamente. Selecione e copie manualmente.');
            }
            document.body.removeChild(ta);
        }

        // ============================================================
        //  FINALIZAR PELADA
        // ============================================================
        function finalizarPelada() {
            if (!timesAtuais.length) {
                alert('Não há times formados. Sorteie os times primeiro.');
                return;
            }

            const confirmar = confirm(
                '⚠️ Deseja realmente finalizar a pelada?\n\n' +
                '• Os placares dos times serão zerados.\n' +
                '• As notas serão ajustadas (+0.5 campeão / -0.5 lanterna).\n' +
                '• O Ranking de Capas será atualizado.\n' +
                '• O Ranking de Pontos será atualizado com os pontos da rodada.\n' +
                '• Um PDF com o resumo da rodada e os rankings será baixado.\n\n' +
                'Essa ação não pode ser desfeita.'
            );
            if (!confirmar) return;

            const snapshotTimes = JSON.parse(JSON.stringify(timesAtuais));

            // 1) Distribui os pontos da rodada para cada jogador
            timesAtuais.forEach(time => {
                const pontosTime = time.pontos || 0;
                if (pontosTime !== 0) {
                    time.jogadores.forEach(jog => {
                        const idxPlantel = jogadores.findIndex(p => p.nome === jog.nome);
                        if (idxPlantel !== -1) {
                            jogadores[idxPlantel].pontosJogador =
                                (jogadores[idxPlantel].pontosJogador || 0) + pontosTime;
                        }
                    });
                }
            });

            // 2) Identifica campeão e lanterna
            const pontos = timesAtuais.map(t => t.pontos);
            const maxPontos = Math.max(...pontos);
            const minPontos = Math.min(...pontos);
            const indicesMax = pontos.reduce((acc, p, i) => p === maxPontos ? [...acc, i] : acc, []);
            const indicesMin = pontos.reduce((acc, p, i) => p === minPontos ? [...acc, i] : acc, []);

            let mensagem = '';
            let houveBonus = false;
            let houvePenalidade = false;

            // 3) Bônus de campeão (ou empate no topo)
            if (indicesMax.length > 1) {
                mensagem = '🏆 Houve empate no primeiro lugar. Nenhum time receberá bônus de nota.\n';
                indicesMax.forEach(idx => {
                    timesAtuais[idx].jogadores.forEach(jog => {
                        const idxPlantel = jogadores.findIndex(p => p.nome === jog.nome);
                        if (idxPlantel !== -1) {
                            jogadores[idxPlantel].pontosCapa =
                                (jogadores[idxPlantel].pontosCapa || 0) + 0.5;
                        }
                    });
                });
                mensagem += '🏅 Times empatados em primeiro ganham 0.5 ponto no Ranking de Capas.\n';
            } else {
                const idxCampeao = indicesMax[0];
                const timeCampeao = timesAtuais[idxCampeao];
                timeCampeao.jogadores.forEach(jog => {
                    jog.nota = parseFloat(Math.min(10, jog.nota + 0.5).toFixed(1));
                    const idxPlantel = jogadores.findIndex(p => p.nome === jog.nome);
                    if (idxPlantel !== -1) jogadores[idxPlantel].nota = jog.nota;
                });
                timeCampeao.jogadores.forEach(jog => {
                    const idxPlantel = jogadores.findIndex(p => p.nome === jog.nome);
                    if (idxPlantel !== -1) {
                        jogadores[idxPlantel].pontosCapa =
                            (jogadores[idxPlantel].pontosCapa || 0) + 1;
                    }
                });
                houveBonus = true;
                mensagem = `🏆 Campeão: ${timeCampeao.nome || 'Time ' + (idxCampeao + 1)} (${timeCampeao.pontos} pts) → +0.5 para cada jogador e +1 ponto no Ranking de Capas.\n`;
            }

            // 4) Penalidade de lanterna (ou empate no fundo)
            if (indicesMin.length > 1) {
                mensagem += '📉 Houve empate no último lugar. Nenhum time será penalizado.';
            } else {
                const idxLanterna = indicesMin[0];
                const timeLanterna = timesAtuais[idxLanterna];
                timeLanterna.jogadores.forEach(jog => {
                    jog.nota = parseFloat(Math.max(0, jog.nota - 0.5).toFixed(1));
                    const idxPlantel = jogadores.findIndex(p => p.nome === jog.nome);
                    if (idxPlantel !== -1) jogadores[idxPlantel].nota = jog.nota;
                });
                houvePenalidade = true;
                mensagem += `📉 Lanterna: ${timeLanterna.nome || 'Time ' + (idxLanterna + 1)} (${timeLanterna.pontos} pts) → -0.5 para cada jogador.`;
            }

            if (!houveBonus && !houvePenalidade) {
                mensagem = '🏆 Houve empate no primeiro lugar e no último lugar. Nenhuma alteração de nota.';
            } else if (!houveBonus) {
                mensagem += '\n\nNão houve bônus (empate no primeiro lugar).';
            } else if (!houvePenalidade) {
                mensagem += '\n\nNão houve penalidade (empate no último lugar).';
            }

            salvarJogadores();
            atualizarTodasListas();

            // 5) Gera PDF com snapshot dos rankings atualizados
            const snapshotJogadoresRanking = JSON.parse(JSON.stringify(jogadores));
            try {
                gerarPDFFinalizacao(snapshotTimes, snapshotJogadoresRanking);
            } catch (err) {
                console.error('Erro ao gerar PDF de finalização:', err);
                alert('Houve um erro ao gerar o PDF de resumo da rodada: ' + err.message);
            }

            // 6) Zera placares para a próxima rodada
            timesAtuais.forEach(time => {
                time.vitorias = 0;
                time.empates = 0;
                time.pontos = 0;
            });
            renderizarTimesAtuais();

            if (modoGerenciamento) {
                renderizarRankingCapas();
                renderizarRankingPontos();
            }

            salvarTimes();
            alert(mensagem + '\n\nPlacares zerados para uma nova rodada! O PDF com o resumo foi baixado.');
        }

        // ============================================================
        //  INICIALIZAÇÃO
        // ============================================================
        carregarJogadores();
        carregarTimes();

        document.getElementById('novoNome').addEventListener('keypress', e => {
            if (e.key === 'Enter') adicionarJogadorPlantel();
        });

        window.addEventListener('beforeunload', function() {
            salvarTimes();
        });
    </script>
